# Available models: "translation", "affine", "affine_with_local_origins"
# Available init_methods: "farneback", "custom_lucas_kanade"
init_params:
    levels: 5
    window_size: 7
    alpha: 1e-3
    goodness_threshold: 2.0
    device: "cuda"
    model: "translation"
    init_method: "farneback"

refine_params:
    steps: 10000
    lr: 1e-1
    
    # AR0 weights (magnitude penalties)
    lambda_ar0_uv: 1e-9
    lambda_ar0_affine: 1e-6
    lambda_ar0_local_origin: 1e-6
    
    # AR1 weights (smoothness penalties)
    lambda_ar1_uv: 0.1
    lambda_ar1_affine: 0.1
    lambda_ar1_affine_uv: 0.1
    lambda_ar1_local_origin: 0.1
    
    # Data term robust loss
    data_alpha: 1.0
    data_c: 1e-3
    
    # AR0 terms robust loss
    ar0_alpha: 1.0
    ar0_c: 1e-3

    # AR1 terms robust loss
    ar1_alpha: 1.0
    ar1_c: 1e-3


